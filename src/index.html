<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estilográfica - simply write!</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <aside class="sidebar" aria-label="Notes">
    <div class="brand">
      <span class="wordmark">Estilográfica</span>
      <button class="icon-btn" id="theme-btn" title="Switch theme (Ctrl+Shift+L)" aria-label="Switch theme">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
    <div class="side-actions">
      <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" spellcheck="false">
      <button class="icon-btn accent" id="new-btn" title="New note (Ctrl+N)" aria-label="New note">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <ul id="note-list" role="listbox" aria-label="Notes"></ul>
    <p class="folder" id="folder" title="Notes folder"></p>
    <p class="credit">
      Made by
      <a id="author-link" href="https://github.com/ItsWakil" title="Wakil on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
        Wakil
      </a>
    </p>
  </aside>

  <main class="main">
    <header class="note-head">
      <input id="title" class="title" aria-label="Note title" spellcheck="false" autocomplete="off">
      <div class="modes" role="radiogroup" aria-label="View">
        <button data-mode="write" role="radio" title="Write only (Ctrl+/ cycles views)">Write</button>
        <button data-mode="split" role="radio" title="Write and preview side by side">Split</button>
        <button data-mode="read" role="radio" title="Preview only">Read</button>
      </div>
      <button class="text-btn danger" id="trash-btn" title="Move note to the trash folder">Trash</button>
    </header>

    <div class="toolbar" role="toolbar" aria-label="Formatting">
      <button data-cmd="heading" title="Heading — click again for smaller (Ctrl+1…3)" aria-label="Heading"><b class="glyph">H</b></button>
      <button data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b class="glyph">B</b></button>
      <button data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i class="glyph serif">I</i></button>
      <button data-cmd="strike" title="Strikethrough (Ctrl+Shift+X)" aria-label="Strikethrough"><s class="glyph">S</s></button>
      <span class="sep"></span>
      <button data-cmd="link" title="Link (Ctrl+K)" aria-label="Link">
        <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      </button>
      <button data-cmd="code" title="Inline code (Ctrl+E)" aria-label="Inline code">
        <svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>
      </button>
      <button data-cmd="codeblock" title="Code block (Ctrl+Shift+E)" aria-label="Code block">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M8 10l-2 2 2 2M12 14h5"/></svg>
      </button>
      <button data-cmd="quote" title="Quote (Ctrl+Shift+Q)" aria-label="Quote">
        <svg viewBox="0 0 24 24"><path d="M5 5v14M10 8h9M10 12h9M10 16h6"/></svg>
      </button>
      <span class="sep"></span>
      <button data-cmd="ul" title="Bullet list (Ctrl+Shift+8)" aria-label="Bullet list">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="7" r="1.2"/><circle cx="5" cy="12" r="1.2"/><circle cx="5" cy="17" r="1.2"/><path d="M9 7h11M9 12h11M9 17h11"/></svg>
      </button>
      <button data-cmd="ol" title="Numbered list (Ctrl+Shift+7)" aria-label="Numbered list">
        <svg viewBox="0 0 24 24"><path d="M4 5h1.5v4M4 9h3M4 14.5c0-1 2.8-1 2.8.3 0 .9-2.8 2.2-2.8 3.2h3M10 7h10M10 12h10M10 17h10"/></svg>
      </button>
      <button data-cmd="task" title="Checklist (Ctrl+Shift+9)" aria-label="Checklist">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="6" height="6" rx="1"/><path d="M4.8 7.6l1.4 1.4 2.3-2.6"/><rect x="3.5" y="13.5" width="6" height="6" rx="1"/><path d="M13 7.5h7M13 16.5h7"/></svg>
      </button>
      <button data-cmd="rule" title="Divider" aria-label="Divider">
        <svg viewBox="0 0 24 24"><path d="M3 12h18"/></svg>
      </button>
    </div>

    <section class="panes" id="panes">
      <textarea id="editor" class="editor" spellcheck="true" aria-label="Note text"
        placeholder="Start writing. Markdown works: # heading, **bold**, *italic*, - list"></textarea>
      <article id="preview" class="preview" aria-label="Preview"></article>
      <div class="empty" id="empty" hidden>
        <p>No notes yet.</p>
        <button class="text-btn accent" id="empty-new">New note</button>
        <p class="hint">or press Ctrl+N</p>
      </div>
    </section>

    <footer class="status">
      <span id="save-state">Saved</span>
      <span id="counts"></span>
    </footer>
  </main>
</body>
</html>
