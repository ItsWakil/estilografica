[package]
name = "estilografica"
version = "0.1.0"
description = "A lightweight Markdown notes app"
authors = ["Wakil"]
edition = "2021"

[lib]
name = "estilografica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
